spring.application.name=Back-end
spring.datasource.url=jdbc:mariadb://localhost:3306/mentors
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
server.port=8082
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.query.parameter_validation=false
mybatis.mapper-locations=classpath:com/dream/mappers/*.xml
server.servlet.session.timeout=30m
spring.security.user.name=admin
spring.security.user.password=securePassword123!
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl


